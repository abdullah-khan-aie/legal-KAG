# EC2 overlay: ship container stdout/stderr to CloudWatch Logs (Docker awslogs driver).
# Used by scripts/docker-aws-up.sh on the app instance (instance role + IMDS).
#
#   CLOUDWATCH_LOG_GROUP=/lodestone-poc/lodestone docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d

services:
  lodestone:
    logging:
      driver: awslogs
      options:
        awslogs-group: ${CLOUDWATCH_LOG_GROUP:?set CLOUDWATCH_LOG_GROUP}
        awslogs-region: ${AWS_REGION:-eu-west-2}
        awslogs-create-group: "false"
