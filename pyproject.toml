[project]
name = "lodestone-graphrag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # --- application layer (src) ---
    "httpx",                 # OpenAI-compatible model/embedding HTTP adapters
    "pydantic>=2",           # settings models (src/config)
    "pydantic-settings>=2",  # env-driven configuration (src/config)
    # --- ingestion (kag builder) ---
    "pyyaml",                # local YAML schema client
    "tenacity",              # retry decorators in extractors/vectorizer/retrievers
    "pandas",                # table extractor
    "markdown",              # table extractor
    "pdfminer.six",          # PDF reader
    "PyPDF2",                # PDF reader
    # --- graph store (kag graphstore) ---
    "neo4j",                 # Neo4j graph store driver
    "schedule",              # periodic constraint/pagerank refresh in Neo4jClient
    # --- retriever / solver foundation (kag) ---
    "networkx",              # solver Context graph
    "numpy",                 # rerank / vector math / utils
    "jinja2",                # prompt/templating utils
    "requests",              # rerank model + utils HTTP
    "docstring_parser",      # tool/executor schema generation
    "aiolimiter",            # async rate limiting in utils
    "cachetools",            # LinkCache (query/one-hop caches)
    # --- solver (kag solver: planner/executor/generator/pipeline) ---
    "openai",                # OpenAI-compatible LLM client
    "ollama",                # local Ollama LLM client
    "pyhocon",               # solver pipeline config (.conf/.yaml) parsing
    "mcp",                   # MCP executor (external tool servers)
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
