<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lodestone — Ask the Graph</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --ink: #1c2230; --muted: #6b7280;
    --line: #e6e8ee; --accent: #3b6ef5; --accent-ink: #ffffff;
    --code-bg: #f2f4f8; --quote: #eef2ff; --err: #c62828; --ok: #15803d;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161a22; --ink: #e6e8ee; --muted: #9aa4b2;
      --line: #262c38; --accent: #5b83f7; --accent-ink: #ffffff;
      --code-bg: #10141b; --quote: #171c2b; --err: #f87171; --ok: #4ade80;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 96px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  header .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  header .sub { color: var(--muted); font-size: 13px; }

  .composer {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px; position: relative;
  }
  textarea#q {
    width: 100%; border: 0; outline: 0; resize: vertical; min-height: 84px;
    background: transparent; color: var(--ink); font: inherit; line-height: 1.5;
  }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); padding: 7px 12px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
  .spacer { flex: 1; }
  button.primary {
    border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font: inherit; padding: 9px 14px; border-radius: 10px; cursor: pointer;
  }
  .hint { color: var(--muted); font-size: 12px; }

  .examples { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .examples button {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 999px; cursor: pointer;
  }
  .examples button:hover { color: var(--ink); border-color: var(--accent); }

  .status { min-height: 22px; margin: 18px 2px 0; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; }
  .status .spin { width: 13px; height: 13px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  .status.err { color: var(--err); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .answer {
    margin-top: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); padding: 22px 24px; min-height: 60px;
  }
  .answer:empty { display: none; }
  .answer > *:first-child { margin-top: 0; }
  .answer > *:last-child { margin-bottom: 0; }
  .answer h1, .answer h2, .answer h3, .answer h4 { line-height: 1.3; letter-spacing: -.01em; }
  .answer h1 { font-size: 1.4em; } .answer h2 { font-size: 1.2em; } .answer h3 { font-size: 1.05em; }
  .answer p { margin: .7em 0; }
  .answer ul, .answer ol { margin: .6em 0; padding-left: 1.4em; }
  .answer li { margin: .25em 0; }
  .answer a { color: var(--accent); text-decoration: none; }
  .answer a:hover { text-decoration: underline; }
  .answer code { background: var(--code-bg); padding: .12em .38em; border-radius: 6px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .answer pre { background: var(--code-bg); padding: 14px 16px; border-radius: 10px;
    overflow: auto; border: 1px solid var(--line); }
  .answer pre code { background: transparent; padding: 0; }
  .answer blockquote { margin: .7em 0; padding: .4em 1em; background: var(--quote);
    border-left: 3px solid var(--accent); border-radius: 6px; color: var(--ink); }
  .answer hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .answer table { border-collapse: collapse; margin: .7em 0; width: 100%; }
  .answer th, .answer td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .caret { display: inline-block; width: 7px; height: 1.05em; vertical-align: text-bottom;
    background: var(--accent); margin-left: 1px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
  .meta:empty { display: none; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="health" title="backend status"></span>
    <h1>Lodestone</h1>
    <span class="sub">ask questions over the knowledge graph</span>
  </header>

  <div class="composer">
    <textarea id="q" placeholder="Ask a question about the ingested documents…
e.g. Who is the buyer in Project Redwood, and what are the key conditions?"></textarea>
    <div class="controls">
      <div class="seg" id="pipeline" role="group" aria-label="Query pipeline">
        <button data-p="retriever" aria-pressed="true">Retriever</button>
        <button data-p="deep_thought" aria-pressed="false">Deep thought</button>
        <button data-p="kag_thinker" aria-pressed="false">KAG thinker</button>
      </div>
      <span class="spacer"></span>
      <button class="ghost" id="stop" hidden>Stop</button>
      <button class="primary" id="ask">Ask</button>
    </div>
    <div class="hint" style="margin-top:8px">Enter to send · Shift+Enter for a new line</div>
  </div>

  <div class="examples" id="examples">
    <button>Summarise the key risks in the Project Vertex heads of terms.</button>
    <button>Which clients have an active dispute, and with whom?</button>
    <button>List the parties and their roles across all deals.</button>
  </div>

  <div class="status" id="status"></div>
  <div class="answer" id="answer"></div>
  <div class="meta" id="meta"></div>

  <footer>Streams from <code>POST /query/stream</code> · answers are grounded in Neo4j</footer>
</div>

<script>
"use strict";

// Where the API lives. Empty string => same origin (the FastAPI app serves this
// page, so /query/stream is same-origin and needs no CORS). Override by setting
// window.LODESTONE_API_BASE before this script, or when hosting the page apart
// from the API (see Frontend/README.md).
const API_BASE = (typeof window.LODESTONE_API_BASE === "string")
  ? window.LODESTONE_API_BASE
  : (location.protocol === "file:" ? "http://localhost:8080" : "");

const $ = (id) => document.getElementById(id);
const qEl = $("q"), askBtn = $("ask"), stopBtn = $("stop");
const statusEl = $("status"), answerEl = $("answer"), metaEl = $("meta"), healthEl = $("health");

let pipeline = "retriever";
let controller = null;

// --- pipeline selector -----------------------------------------------------
$("pipeline").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  pipeline = b.dataset.p;
  for (const btn of $("pipeline").children) btn.setAttribute("aria-pressed", String(btn === b));
});

// --- example chips ---------------------------------------------------------
$("examples").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  qEl.value = b.textContent.trim(); qEl.focus(); ask();
});

// --- keyboard: Enter sends, Shift+Enter newline ----------------------------
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
askBtn.addEventListener("click", ask);
stopBtn.addEventListener("click", () => { if (controller) controller.abort(); });

// --- minimal, dependency-free Markdown renderer ----------------------------
// Handles the constructs LLM answers actually use (headings, bold/italic,
// inline code, fenced code, lists, blockquotes, links, rules, tables) so the
// raw "**", "-", "#" markers never leak into the UI. HTML is escaped first, so
// this is safe to feed with model output.
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function formatInline(text) {
  let s = escapeHtml(text);
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    (_, label, url) => `<a href="${url}" rel="noopener" target="_blank">${label}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_])_([^_\s][^_]*?)_(?!_)/g, "$1<em>$2</em>");
  return s;
}
function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0, para = [];
  const flushPara = () => {
    if (para.length) { out.push(`<p>${formatInline(para.join(" "))}</p>`); para = []; }
  };
  while (i < lines.length) {
    let line = lines[i];

    // fenced code block
    const fence = line.match(/^\s*```(.*)$/);
    if (fence) {
      flushPara(); const code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; // consume closing fence
      out.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }
    // heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); const n = h[1].length; out.push(`<h${n}>${formatInline(h[2])}</h${n}>`); i++; continue; }
    // horizontal rule
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushPara(); out.push("<hr>"); i++; continue; }
    // table (header row + separator row of ---|---)
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      flushPara();
      const cells = (r) => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
      const head = cells(line); i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { body.push(cells(lines[i])); i++; }
      let t = "<table><thead><tr>" + head.map((c) => `<th>${formatInline(c)}</th>`).join("") + "</tr></thead><tbody>";
      for (const row of body) t += "<tr>" + row.map((c) => `<td>${formatInline(c)}</td>`).join("") + "</tr>";
      out.push(t + "</tbody></table>");
      continue;
    }
    // blockquote (consecutive > lines)
    if (/^\s*>\s?/.test(line)) {
      flushPara(); const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push(`<blockquote>${formatInline(buf.join(" "))}</blockquote>`);
      continue;
    }
    // unordered list
    if (/^\s*[-*+]\s+/.test(line)) {
      flushPara(); const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      out.push("<ul>" + items.map((it) => `<li>${formatInline(it)}</li>`).join("") + "</ul>");
      continue;
    }
    // ordered list
    if (/^\s*\d+\.\s+/.test(line)) {
      flushPara(); const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
      out.push("<ol>" + items.map((it) => `<li>${formatInline(it)}</li>`).join("") + "</ol>");
      continue;
    }
    // blank line ends a paragraph
    if (/^\s*$/.test(line)) { flushPara(); i++; continue; }
    // plain paragraph text
    para.push(line.trim()); i++;
  }
  flushPara();
  return out.join("\n");
}

// --- rendering with a streaming caret --------------------------------------
let raw = "", rafPending = false;
function scheduleRender(showCaret) {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    answerEl.innerHTML = renderMarkdown(raw) + (showCaret ? '<span class="caret"></span>' : "");
  });
}

function setStatus(text, kind) {
  statusEl.className = "status" + (kind === "err" ? " err" : "");
  statusEl.innerHTML = (kind === "run" ? '<span class="spin"></span>' : "") + (text || "");
}

// --- the ask flow ----------------------------------------------------------
async function ask() {
  const query = qEl.value.trim();
  if (!query || controller) return;

  raw = ""; answerEl.innerHTML = ""; metaEl.textContent = "";
  $("examples").style.display = "none";
  askBtn.disabled = true; stopBtn.hidden = false;
  setStatus("Sending…", "run");

  const started = performance.now();
  controller = new AbortController();
  let gotAnswer = false;

  try {
    const res = await fetch(API_BASE + "/query/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
      body: JSON.stringify({ query, pipeline }),
      signal: controller.signal,
    });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf = (buf + dec.decode(value, { stream: true })).replace(/\r\n/g, "\n");

      // SSE frames are separated by a blank line
      let sep;
      while ((sep = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, sep); buf = buf.slice(sep + 2);
        let event = "message"; const data = [];
        for (const l of frame.split("\n")) {
          if (l.startsWith(":")) continue;              // comment / heartbeat
          if (l.startsWith("event:")) event = l.slice(6).trim();
          else if (l.startsWith("data:")) data.push(l.slice(5).replace(/^ /, ""));
        }
        const payload = data.join("\n");
        handleEvent(event, payload, () => { gotAnswer = true; });
      }
    }
  } catch (err) {
    if (err.name === "AbortError") setStatus("Stopped.", "");
    else setStatus("Request failed: " + err.message, "err");
  } finally {
    controller = null;
    askBtn.disabled = false; stopBtn.hidden = true;
    scheduleRender(false);
    if (gotAnswer) {
      const secs = ((performance.now() - started) / 1000).toFixed(1);
      metaEl.innerHTML = `<span>pipeline: ${pipeline}</span><span>${secs}s</span>`;
    }
  }
}

function handleEvent(event, data, markAnswer) {
  if (event === "token") {
    try { raw += JSON.parse(data).delta || ""; } catch { raw += data; }
    setStatus("Generating…", "run");
    scheduleRender(true);
  } else if (event === "answer") {
    try { raw = JSON.parse(data).answer || raw; } catch {}
    markAnswer(); scheduleRender(true);
  } else if (event === "step") {
    let s = "Working…";
    try { const o = JSON.parse(data); s = (o.stage || "step") + (o.label ? " · " + o.label : ""); } catch {}
    setStatus(s, "run");
  } else if (event === "error") {
    let msg = data; try { msg = JSON.parse(data).error || data; } catch {}
    setStatus("Error: " + msg, "err");
  } else if (event === "done") {
    setStatus("Done.", "");
  }
}

// --- lightweight health check (colours the header dot) ---------------------
(async () => {
  try {
    const r = await fetch(API_BASE + "/docs", { method: "GET" });
    if (r.ok) healthEl.classList.add("live");
  } catch { /* leave grey */ }
})();
qEl.focus();
</script>
</body>
</html>
